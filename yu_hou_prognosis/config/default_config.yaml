# ============================================================
# DealWith Histomolecular - 默认配置文件
# 下游任务: 用WSI patch图像预测肠分化/粘液相关RNA-seq基因表达
# 所有路径均为相对于项目根目录(yu_hou_prognosis/)的相对路径，也可使用绝对路径
# 命令行参数可覆盖此文件中的任何配置项
# ============================================================

# ---- 项目基本信息 ----
project:
  name: "DealWith_Histomolecular"
  version: "3.0.0"
  description: "结直肠癌WSI病理图像预测肠分化/粘液相关基因表达(Histomolecular任务)"

# ---- 上游WSI Patch数据 (完全复用上游wsi_patch_selection_benchmark输出, 不改上游代码) ----
upstream:
  enabled: true
  # 上游项目输出的patch根目录
  patch_root: "../wsi_patch_selection_benchmark/outputs/patches"
  # 使用哪个算法的patch (grid/stratified/sentinel/random/kmeans/yottixel/splice/sdm/largest_tissue)
  algorithm_name: "grid"
  file_pattern: "{slide_base}_{idx}.png"
  # 每个病人使用的patch数量 (同一个病人6张WSI切片, 训练时patient-level聚合)
  num_patches_per_patient: 6
  patch_size: 1024

# ---- 数据路径 ----
data:
  root: "data"
  # 表格文件: TCGA ID + 临床信息 + 多个目标基因rnaseq表达值
  genomic_csv: "data/COAD_all_dataset.csv"
  # 预生成的按病人ID划分的5折拆分文件
  split_file: "data/splits/coad_allst_patient5fold.pkl"
  genomic:
    # 病人ID列名
    patient_id_col: "TCGA ID"
    # 存活时间列名 (仅用于附属KM生存分析)
    survtime_col: "Survival months"
    # 删失标记列名 (1=事件发生, 0=删失; 仅用于附属KM生存分析)
    censor_col: "event"
    # 目标基因列表 (默认肠分化/粘液相关基因; 支持批量训练)
    target_genes: ["REG4", "OLFM4", "MUC2", "DEFA5"]
    # 可选协变量列 (临床/其他分子特征, 参与多模态融合; 留空则纯图像path-only)
    # 注意: 不要放入目标基因自身的表达列, 否则会造成标签泄露
    covariate_cols: []
    # RNA-seq表达列后缀 (用于自动解析 "REG4" -> "REG4_rnaseq")
    rnaseq_suffix: "_rnaseq"

# ---- 图像预处理 (保留, 数据集暂未强制接入; 可通过preprocessing.py单独使用) ----
image_preprocessing:
  enabled: false
  denoise: { method: "gaussian", kernel_size: 3, sigma: 0 }
  contrast: { method: "clahe", clip_limit: 2.0, tile_grid_size: [8, 8] }
  color_normalization: { method: "reinhard", target_mean: [0.5, 0.5, 0.5], target_std: [0.5, 0.5, 0.5] }
  blur_filter: { enabled: false, method: "laplacian_variance", threshold: 100.0, strategy: "mark_only", max_blur_ratio_per_patient: 0.5 }

# ---- 模型 ----
model:
  # 运行模式: path / omic / pathomic (path=纯图像预测基因, pathomic=图像+协变量融合)
  mode: "path"
  name: "Histomolecular"
  # 任务类型: classification(二分类高/低表达) / regression(连续表达量回归, 可选)
  task_type: "classification"
  # 指定目标基因 (命令行 --target_gene 可覆盖; 需在 data.genomic.target_genes 中或为合法rnaseq列)
  target_gene: "REG4"
  # 二分类分组阈值: median(中位数, 默认) / mean / quantile / 数值(自定义阈值)
  group_threshold: "median"
  # 分类时的标签模式: binary(高表达=1 / 低表达=0)
  label_mode: "binary"
  seed: 2026

  # ---- 病理图像分支 (PathNet) ----
  path:
    backbone: "resnet50"
    pretrained: "weights/resnet50-0676ba61.pth"
    dim: 32
    freeze_backbone: false
    freeze_bn: false
    input_size: 1024

  # ---- 协变量分支 (OmicNet) ----
  # 当 mode=pathomic 时, 输入维度由 data.genomic.covariate_cols 自动推断;
  # 当 covariate_cols 为空时 mode 自动回退为 path。
  omic:
    input_dim: 0
    dim: 32
    hidden_dims: [64, 48, 32]
    pretrained: ""

  # ---- 多模态融合 (保留9种策略; path-only时自动旁路) ----
  fusion:
    type: "caugf"
    hidden_dim: 64
    output_dim: 64
    dropout: 0.5
    caugf:
      min_stream_weight: 0.12
      use_relation: true
      relation_types: ["product", "difference", "cosine"]
      num_post_layers: 2
      use_layer_norm: true
      temperature_init: 1.0
    cross_attention: { num_heads: 4, num_layers: 2, ff_expansion: 4 }
    attention_weighted: { num_heads: 4, use_residual: true }
    lmf: { rank: 4 }
    pofusion: { skip: 1, use_bilinear: 1, gate1: 1, gate2: 1 }

# ---- 训练配置 ----
training:
  device: "auto"
  gpu_id: 0
  gpu_memory_fraction: 0.0
  batch_size: 4
  gradient_accumulation_steps: 2
  num_workers: 0
  pin_memory: false
  non_blocking: false
  prefetch_factor: 2

  optimizer:
    type: "adamw"
    lr: 0.00002
    weight_decay: 0.001
    betas: [0.9, 0.999]
    final_lr: 0.1

  scheduler:
    type: "cosine"
    n_epochs: 8
    n_epochs_decay: 4
    warmup_epochs: 2
    min_lr: 1.0e-6
    lr_decay_iters: 10

  amp:
    enabled: false
    dtype: "float16"

  # ---- 损失配置 ----
  loss:
    # 任务损失类型: ce(分类CrossEntropy) / bce / focal(分类) / mse(回归)
    task_loss: "ce"
    # 分类任务损失权重
    lambda_task: 1.0
    # 正则化损失权重
    lambda_reg: 0.0003
    # 正则化类型: none / path / mm / all / omic
    reg_type: "path"

  # ---- 分类任务损失细节 ----
  classification:
    loss_type: "ce"          # ce / bce / focal
    use_class_weights: true
    label_smoothing: 0.0
    focal_alpha: 0.25
    focal_gamma: 2.0

  # ---- 早停 ----
  early_stopping:
    enabled: true
    # 监控指标: auc / accuracy / f1 / loss (分类); loss / pearson / spearman (回归)
    monitor: "auc"
    patience: 5
    min_delta: 0.001

  gradient_clip_norm: 1.0
  finetune: false
  act_type: "none"
  init_type: "none"
  init_gain: 0.02

  checkpoint:
    save_every: 1
    resume: true
    keep_last_n: 3

  gpu_monitor:
    enabled: true
    oom_protection: true
    memory_warning_threshold: 0.85
    log_interval: 10

# ---- 交叉验证 (按病人ID划分, 同一病人6张切片不跨train/val/test) ----
cross_validation:
  n_folds: 5
  fold_ids: [1]
  shuffle: true
  # 从训练集切出验证集的比例 (0表示不切val, 仅train/test)
  val_ratio: 0.2

# ---- 评估配置 ----
evaluation:
  n_bootstrap: 100
  average: "binary"
  per_fold_details: true
  # 主指标: ACC / AUC / F1 (分类), MSE / Pearson (回归)
  metrics:
    classification:
      - "accuracy"
      - "balanced_accuracy"
      - "precision"
      - "recall"
      - "f1_score"
      - "auc"
      - "average_precision"
      - "mcc"
    regression:
      - "mse"
      - "mae"
      - "rmse"
      - "pearson"
      - "spearman"
  # 附属生存分析: 用预测的分子表型分组画KM + logrank检验 (仅补充验证)
  auxiliary_survival:
    enabled: true
    # 分组方法: median(预测分数中位) / binary(分类概率>0.5)
    split_method: "median"

# ---- 可视化配置 ----
visualization:
  enabled: true
  dpi: 300
  formats: ["png"]
  roc_curve: { title: "ROC曲线" }
  confusion_matrix: { title: "混淆矩阵" }
  km_curve:
    xlabel: "时间 (月)"
    ylabel: "总体生存率 (OS)"
    title: "Kaplan-Meier生存曲线(按预测分子表型分组)"
    show_ci: true
    show_risk_table: false
    color_high_risk: "#e74c3c"
    color_low_risk: "#2ecc71"
  calibration_curve: { title: "校准曲线", n_bins: 10 }

# ---- 日志配置 ----
logging:
  level: "INFO"
  language: "zh_CN"
  format: "%(asctime)s [%(levelname)s] %(message)s"
  file: "logs/train.log"
  console: true
  log_model_arch: true
  log_gpu_info: true

# ---- 实验管理 ----
experiment:
  name: "default"
  output_root: "experiments"
  description: "Histomolecular基因表达预测实验"
  subdirs:
    ckpt: "ckpt"
    logs: "logs"
    resume: "resume"
    preds: "preds"
    results: "results"
    figures: "figures"
  save_predictions: true
  save_epoch_predictions: false

# ---- 消融实验框架 ----
# 用于对比不同上游patch采样算法对分子表型预测的影响 (上游9种采样算法不动)
ablation:
  # 要对比的上游采样算法列表 (每次运行用同一套下游配置, 只切换algorithm_name)
  algorithms: ["grid", "random", "kmeans", "yottixel", "stratified", "sentinel", "splice", "sdm", "largest_tissue"]
  # 要训练的基因列表 (为空则用 data.genomic.target_genes)
  target_genes: []
