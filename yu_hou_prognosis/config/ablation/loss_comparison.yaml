# ============================================================
# 损失函数对比消融实验配置
# 分类任务: ce / bce / focal
# 回归任务: mse / mae / huber
# 使用方式: python main.py --mode train --target_gene REG4 --config 本文件
#   并临时修改 training.loss.task_loss 或 training.classification.loss_type
# ============================================================

experiment:
  name: "ablation_loss_comparison"
  description: "损失函数对比消融实验"

model:
  task_type: "classification"
  target_gene: "REG4"

training:
  loss:
    task_loss: "ce"
  classification:
    loss_type: "ce"
