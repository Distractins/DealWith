# ============================================================
# 融合策略对比消融实验配置 (保留9种融合策略)
# 使用方式: 对每种融合策略运行一次训练, 比较ACC/AUC/F1
#   python main.py --mode train --fusion_type concat --exp_name fusion_concat
#   python main.py --mode train --fusion_type caugf  --exp_name fusion_caugf
#   ... (pofusion/lmf/gmu/film/attention_weighted/cross_attention/tensor_concat)
# ============================================================

experiment:
  name: "ablation_fusion_comparison"
  description: "9种融合策略横向对比 (注: path-only时融合被旁路, 需 mode=pathomic)"

model:
  mode: "pathomic"   # 需配合 data.genomic.covariate_cols 使用协变量
  task_type: "classification"
  fusion:
    type: "caugf"
