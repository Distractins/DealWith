# ============================================================
# 图像预处理消融实验配置
# 注: 当前数据集默认未强制接入 ImagePreprocessor, 需在 datasets.py 中
#     显式启用后本配置才生效。逐项对比去噪/增强/归一化影响。
# ============================================================

experiment:
  name: "ablation_preprocessing"
  description: "图像预处理模块消融实验"

image_preprocessing:
  enabled: true
  denoise:
    method: "gaussian"
  contrast:
    method: "clahe"
  color_normalization:
    method: "reinhard"
